# deployment on AWS EC2
version: "3.8"

services:
  backend:
    image: kmanish9301/ai-interview-backend:latest
    container_name: ai-interview-backend
    restart: always
    env_file:
      - ./server/.env
    expose:
      - "5000"

  frontend:
    image: kmanish9301/ai-interview-frontend:latest
    container_name: ai-interview-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
